name: Release GPUI Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag on main, such as v2.0.0-beta.33."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codux-release
  cancel-in-progress: false

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  metadata:
    if: github.repository == 'LChJo/codux'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
    env:
      SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: source
        shell: bash
        run: |
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          sha=$(git rev-parse --verify "refs/tags/$SOURCE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          git checkout --detach "$sha"
          echo "tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate release metadata
        id: metadata
        env:
          RELEASE_NOTES_PATH: dist/release-notes.md
        run: node apps/desktop/scripts/release/prepare-release.mjs "$SOURCE_TAG" auto --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error

  desktop:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { id: macos-aarch64, os: macos-26, target: aarch64-apple-darwin }
          - { id: macos-x86_64, os: macos-26, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RELEASE_BUILD_ID: ${{ matrix.id }}
      RELEASE_WRITE_SHA256: "true"
      RELEASE_ALLOW_UNSIGNED: "true"
      MACOS_ADHOC_SIGN: "true"
      CODUX_UPDATER_PUBLIC_KEY: ${{ vars.CODUX_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Apply version and build
        shell: bash
        run: |
          node apps/desktop/scripts/release/prepare-release.mjs "$SOURCE_TAG" "$RELEASE_CHANNEL"
          cargo build --locked --release -p codux -p codux-wrapper-helper --target "$CARGO_BUILD_TARGET"
      - name: Package desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" && -z "$CODUX_UPDATER_PUBLIC_KEY" ]] ||
             [[ -z "$TAURI_SIGNING_PRIVATE_KEY" && -n "$CODUX_UPDATER_PUBLIC_KEY" ]]; then
            echo "::error::Configure both the updater signing secret and its matching public key, or leave both empty."
            exit 1
          fi
          node apps/desktop/scripts/release/package-gpui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: release-artifacts/${{ matrix.id }}/*
          if-no-files-found: error

  agent:
    needs: metadata
    permissions:
      contents: write
    uses: ./.github/workflows/release-agent.yml
    with:
      tag: ${{ needs.metadata.outputs.tag }}
      source_sha: ${{ needs.metadata.outputs.sha }}
      channel: ${{ needs.metadata.outputs.channel }}
      build_only: true

  publish:
    needs: [metadata, desktop, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_NOTES_PATH: dist/release-notes.md
      RELEASE_ARTIFACTS_DIR: release-artifacts
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: "{desktop,agent}-*"
          path: release-artifacts
          merge-multiple: true
      - name: Verify required assets and publish
        shell: bash
        run: |
          for asset in \
            codux-windows-x86_64-setup.exe codux-macos-aarch64.dmg codux-macos-x86_64.dmg \
            codux-windows-x86_64.exe codux-macos-aarch64 codux-macos-x86_64 \
            codux-linux-x86_64 codux-linux-aarch64; do
            if [[ ! -s "$RELEASE_ARTIFACTS_DIR/$asset" ]]; then
              echo "::error::Release asset is missing or empty: $asset"
              exit 1
            fi
          done
          node apps/desktop/scripts/release/publish-github-release.mjs
