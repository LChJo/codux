[package]
name = "codux-blackboard"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
html2text = "0.17.1"
image = "0.25.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5.7"
uuid = { version = "1", features = ["v4"] }
