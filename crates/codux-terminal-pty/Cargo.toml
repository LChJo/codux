[package]
name = "codux-terminal-pty"
version = "1.8.1"
edition = "2024"

[dependencies]
codux-terminal-core = { path = "../codux-terminal-core" }
portable-pty = "0.9"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_System_JobObjects"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
